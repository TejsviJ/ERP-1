<style>

  color:#0b5f5e;border-radius:12px;padding:2px 8px;font-size:12px}

<script>
const CHANNELS=['3rd Party Exporter','Direct Export','Domestic CM'];
const CATS=['Account','Lead'];
const STATUSES=['Not Started','In Progress','Waiting','On Hold','Done'];
const PRIOS=['High','Medium','Low'];
const KINDS=[['update','Update to take'],['todo','To-do task']];
const RECUR=['None','Weekly','Fortnightly','Monthly','Quarterly','Half-Yearly'];
const RECUR_DAYS={Weekly:7,Fortnightly:14};
const ESC_DAYS=7;
const BUCKETS=[['overdue','Overdue'],['today','Due today'],['week','This week'],['nextweek','Next week'],['month','This month'],['clear','All clear']];
const LOG_DAYS=10;   // a company is "pending log" if not contacted in this many days
const COUNTRIES=["Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia","Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi","Cabo Verde","Cambodia","Cameroon","Canada","Central African Republic","Chad","Chile","China","Colombia","Comoros","Congo (Brazzaville)","Congo (Kinshasa)","Costa Rica","C\u00f4te d'Ivoire","Croatia","Cuba","Cyprus","Czechia","Denmark","Djibouti","Dominica","Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia","Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti","Honduras","Hong Kong","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kiribati","Kosovo","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Macao","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway","Oman","Pakistan","Palau","Palestine","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia","Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines","Samoa","San Marino","Sao Tome and Principe","Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria","Taiwan","Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga","Trinidad and Tobago","Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates","United Kingdom","United States","Uruguay","Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"];
const REGIONS=["GCC","SEA","LATAM","EAEU","West Africa","East Africa","CIS","MENA","Kurdistan","Balkans"];
const ALL_MARKETS=REGIONS.concat(COUNTRIES);


/* ---------- state ---------- */
const S={users:[],clients:[],log:[],sessions:[],reqs:[],snaps:[],notifs:[],pending:[],me:null,tab:'dash',
  filters:{q:'',channel:'',cat:'',handler:'',status:'',rem:''},
  sel:new Set(),open:null,modal:null,sort:{k:'due',dir:1},showDone:false,
  drawerLogs:null,scope:'mine'};
const todayISO=()=>new Date().toISOString().slice(0,10);
const uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const dayDiff=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/86400000);
const openItems=c=>(c.items||[]).filter(i=>!i.done);
const doneItems=c=>(c.items||[]).filter(i=>i.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));

function itemState(i){
  if(i.done) return {k:'done',t:'Done',cls:'done',d:null};
  if(!i.deadline) return {k:'none',t:'No date',cls:'none',d:null};
  const d=dayDiff(i.deadline);
  if(d<0) return {k:'overdue',t:'Overdue '+(-d)+'d',cls:'overdue',d};
  if(d===0) return {k:'today',t:'Due today',cls:'today',d};
  if(d<=(i.lead??7)) return {k:'win',t:'In '+d+'d',cls:'win',d};
  return {k:'up',t:'In '+d+'d',cls:'',d};
}
function remind(c){
  const open=openItems(c);
  if(c.status==='Done'||(!open.length&&(c.items||[]).length)) return {k:'done',t:'All clear',cls:'done',d:null};
  const dated=open.filter(i=>i.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline));
  if(!dated.length) return {k:'none',t:open.length?open.length+' open, no date':'No date',cls:'none',d:null};
  const st=itemState(dated[0]); st.item=dated[0]; return st;
}
/* week/month windows — week runs Monday to Sunday */
function daysToWeekEnd(){ const t=new Date(todayISO()+'T00:00:00'); return 6-((t.getDay()+6)%7); }
function daysToMonthEnd(){ const t=new Date(todayISO()+'T00:00:00');
  const e=new Date(t.getFullYear(),t.getMonth()+1,0); return Math.round((e-t)/86400000); }
function bucketOf(c){
  const r=remind(c);
  if(r.k==='done') return 'clear';
  if(r.d==null) return 'nodate';
  const d=r.d, w=daysToWeekEnd(), m=daysToMonthEnd();
  if(d<0) return 'overdue';
  if(d===0) return 'today';
  if(d<=w) return 'week';
  if(d<=w+7) return 'nextweek';
  if(d<=m) return 'month';
  return 'later';
}
const bucketLabel=b=>(BUCKETS.find(x=>x[0]===b)||[b,'Later'])[1];
function escalations(list){
  const out=[];
  list.forEach(c=>openItems(c).forEach(i=>{
    if(i.deadline && dayDiff(i.deadline) < -ESC_DAYS) out.push({c,i,days:-dayDiff(i.deadline)}); }));
  return out.sort((a,b)=>b.days-a.days);
}
function nextDate(iso,recur){
  const base=new Date((iso||todayISO())+'T00:00:00');
  if(RECUR_DAYS[recur]) base.setDate(base.getDate()+RECUR_DAYS[recur]);
  else if(recur==='Monthly') base.setMonth(base.getMonth()+1);
  else if(recur==='Quarterly') base.setMonth(base.getMonth()+3);
  else if(recur==='Half-Yearly') base.setMonth(base.getMonth()+6);
  else return '';
  let out=base.toISOString().slice(0,10);
  while(dayDiff(out)<0){ const b=new Date(out+'T00:00:00');
    if(RECUR_DAYS[recur]) b.setDate(b.getDate()+RECUR_DAYS[recur]);
    else b.setMonth(b.getMonth()+(recur==='Monthly'?1:recur==='Quarterly'?3:6));
    out=b.toISOString().slice(0,10); }
  return out;
}
/* daily snapshot of headline counts */
function snapNow(){
  const all=S.clients;
  const s={date:todayISO(),companies:all.length,
    accounts:all.filter(c=>c.category==='Account').length,
    leads:all.filter(c=>c.category==='Lead').length,
    open:all.reduce((n,c)=>n+openItems(c).length,0),
    overdue:all.filter(c=>bucketOf(c)==='overdue').length,
    unassigned:all.filter(c=>!c.handler||c.handler==='Unassigned').length,
    closed:all.reduce((n,c)=>n+doneItems(c).length,0),
    pending_logs:all.filter(c=>needsLog(c)).length};
  return s;
}
function saveSnap(){
  // Snapshots are written nightly by the database (take_snapshot()).
  // Locally we just keep today's figures fresh so Movement compares correctly.
  const s=snapNow();
  S.snaps=(S.snaps||[]).filter(x=>x.date!==s.date); S.snaps.push(s);
  S.snaps.sort((a,b)=>a.date.localeCompare(b.date));
}
function snapBack(days){
  if(!S.snaps||!S.snaps.length) return null;
  const target=new Date(Date.now()-days*86400000).toISOString().slice(0,10);
  const older=S.snaps.filter(s=>s.date<=target);
  return older.length?older[older.length-1]:null;
}
// A company needs a log if not contacted in LOG_DAYS (or never), unless Done.
function needsLog(c){
  if(c.status==='Done') return false;
  const base=c.lastContacted||c.created;
  if(!base) return true;
  return dayDiff(base) <= -LOG_DAYS;
}
function daysSinceContact(c){
  const base=c.lastContacted||c.created;
  return base? -dayDiff(base) : 999;
}
function pendingLogs(scopeName){
  return S.clients.filter(c=>needsLog(c) &&
    (!scopeName || (c.handler||'Unassigned')===scopeName))
    .sort((a,b)=>daysSinceContact(b)-daysSinceContact(a));
}
const unreadNotifs=()=>S.notifs.filter(n=>!n.read).length;
const members=()=>S.users.filter(u=>u.active!==false).map(u=>u.name);
const isAdmin=()=>S.me&&S.me.role==='admin';
const canEdit=c=>isAdmin()||c.handler===S.me.name;

/* ---------- boot ---------- */
async function boot(){
  try {
    S.me = await API.currentUser();

    if (!S.me) {
      render();
      return;
    }

    const data = await API.loadAll();

    S.users = data.users;
    S.clients = data.clients;
    S.reqs = data.reqs;
    S.log = data.log;
    S.sessions = data.sessions;
    S.snaps = data.snaps;
    S.notifs = data.notifs || [];
    S.pending = data.pending || [];

    render();
  } catch (e) {
    console.error('Boot failed:', e);
    toast('Could not load CRM data');
    render();
  }
}
async function refresh(){
  try {
    const data = await API.loadAll();

    S.users = data.users;
    S.clients = data.clients;
    S.reqs = data.reqs;
    S.log = data.log;
    S.sessions = data.sessions;
    S.snaps = data.snaps;
    S.notifs = data.notifs || [];
    S.pending = data.pending || [];

    render();
    toast('Latest data loaded');
  } catch (e) {
    console.error('Refresh failed:', e);
    toast('Could not load latest data');

async function doLogin(){
  const e = document.getElementById('lu').value.trim().toLowerCase();
  const p = document.getElementById('lp').value;
  const err = document.getElementById('lerr');

  err.textContent = '';

  try {
    const me = await API.signIn(e, p);

    S.me = me;
    S.tab = 'dash';

    const data = await API.loadAll();

    S.users = data.users;
    S.clients = data.clients;
    S.reqs = data.reqs;
    S.log = data.log;
    S.sessions = data.sessions;
    S.snaps = data.snaps;
    S.notifs = data.notifs || [];
    S.pending = data.pending || [];

    render();
  } catch (e) {
    console.error('Login failed:', e);
    err.textContent = e.message || 'Unable to sign in.';
  }
}
async function doSetPass(){
  const e = document.getElementById('lu').value.trim().toLowerCase();
  const p = document.getElementById('lp').value;
  const p2 = document.getElementById('lp2').value;
  const err = document.getElementById('lerr');

  err.textContent = '';

  if (p.length < 6) {
    err.textContent = 'Use at least 6 characters.';
    return;
  }

  if (p !== p2) {
    err.textContent = 'The two passwords do not match.';
    return;
  }

  try {
    await API.requestPasswordSet(e);
    err.textContent = 'Password setup link sent. Check your email.';
  } catch (e) {
    console.error('Password setup failed:', e);
    err.textContent = e.message || 'Unable to send password setup link.';
  }
}
async function logout(){
  try {

    console.error('Logout failed:', e);

}

function filtered(){
  const f=S.filters;
  let l=S.clients.filter(c=>{
    if(f.channel&&c.channel!==f.channel)return false;
    if(f.cat&&c.category!==f.cat)return false;
    if(f.handler&&(c.handler||'Unassigned')!==f.handler)return false;
    if(f.status&&c.status!==f.status)return false;
    if(f.rem&&bucketOf(c)!==f.rem)return false;
    if(f.q){const q=f.q.toLowerCase();
      const hay=(c.name+' '+countriesOf(c).join(' ')+' '+(c.country||'')+' '+(c.notes||'')+' '+(c.items||[]).map(i=>i.text).join(' ')).toLowerCase();
      if(!hay.includes(q))return false;}
    return true;});
  const k=S.sort.k,dir=S.sort.dir;
  l.sort((a,b)=>{ if(k==='due'){const A=remind(a).d,B=remind(b).d;
      if(A==null&&B==null)return a.name.localeCompare(b.name); if(A==null)return 1; if(B==null)return -1; return (A-B)*dir;}
    return String(a[k]||'').localeCompare(String(b[k]||''))*dir;});
  return l;
}

function bulkValueField(f){
  const sel=o=>`<select id="bulkval" style="width:auto">${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;

  if(f==='countries') return `<select id="bulkval" style="width:auto">

async function bulkApply(){
  const f=document.getElementById('bulkf').value;
  const el=document.getElementById('bulkval');
  const v=el.value && el.value.trim ? el.value.trim() : el.value;
  const ids=[...S.sel];
  if(!ids.length) return;
  try{
    if(f==='countries'){
      // set the ONE picked market on all selected (replaces their country set)
      await API.bulkUpdate(ids,{countries:[v]});
    } else if(f==='category'){
      for(const id of ids){ const c=S.clients.find(x=>x.id===id);
        const patch={category:v};
        if(c.category==='Lead'&&v==='Account'){ patch.convertedAt=todayISO(); patch.leadSince=c.leadSince||c.created||todayISO(); }
        if(v==='Lead'){ patch.convertedAt=null; patch.leadSince=c.leadSince||c.created||todayISO(); }
        await API.updateCompany(id,patch);
      }
    } else {
      await API.bulkUpdate(ids,{[f]:v});
    }
    S.sel.clear();
    const label={handler:'handler',channel:'channel',category:'type',countries:'market',status:'status',priority:'priority'}[f];
    await addLog(`Set ${label} to ${v} on ${ids.length} compan${ids.length===1?'y':'ies'}`);
    await refresh();
  }catch(e){ toast(e.message||'Bulk update failed'); }
}
function setCategory(c,v){
  if(c.category===v) return;
  if(c.category==='Lead'&&v==='Account'){ c.convertedAt=todayISO(); c.convertedBy=S.me.name;
    c.leadSince=c.leadSince||c.created||todayISO(); }
  if(v==='Lead'){ c.convertedAt=null; c.convertedBy=null; c.leadSince=c.leadSince||c.created||todayISO(); }
  c.category=v;
}

async function upd(k, v) {
  const c = S.clients.find(x => x.id === S.open);
  if (!c || !canEdit(c)) return;
  if (k === 'handler' && !isAdmin()) return;

  try {
    if (k === 'category') {
      const was = c.category;

      setCategory(c, v);

      await API.updateCompany(c.id, {
        category: c.category,
        leadSince: c.leadSince,
        convertedAt: c.convertedAt
      });

      const fresh = await API.reloadCompany(c.id);

      if (fresh) {
        const ix = S.clients.findIndex(x => x.id === c.id);
        if (ix !== -1) S.clients[ix] = fresh;
      }

      await API.log(
        was === 'Lead' && v === 'Account'
          ? `Converted ${c.name} from lead to account`
          : `Set ${c.name} as ${v}`,
        S.me.id,
        S.me.name
      );

      render();
      toast('Saved');
      return;
    }

    await API.updateCompany(c.id, {
      [k]: v
    });

    c[k] = v;

    await API.log(
      `Updated ${c.name} (${k})`,
      S.me.id,
      S.me.name
    );

    render();
    toast('Saved');

  } catch (e) {
    console.error('Update failed:', e);
    toast(e.message || 'Could not save changes');
  }
}
async function addItem(id){
  const c = S.clients.find(x => x.id === id);
  if (!canEdit(c)) return;

  const t = document.getElementById('nt').value.trim();
  if (!t) {
    toast('Type the follow-up first');
    return;
  }

  const kind = document.getElementById('nk').value;
  const dl = document.getElementById('nd').value;
  const ld = parseInt(document.getElementById('nl').value) || 0;
  const rc = document.getElementById('nr').value;

  const bullets = t.split('\n')
    .map(x => x.replace(/^[-•*]\s*/, '').trim())
    .filter(Boolean)
    .map(txt => ({
      kind,
      text: txt,
      deadline: dl,
      lead: ld,
      recur: rc
    }));

  try {
    await API.addItems(id, bullets);

    const fresh = await API.reloadCompany(id);
    if (fresh) {
      const ix = S.clients.findIndex(x => x.id === id);
      if (ix !== -1) S.clients[ix] = fresh;
    }

    await API.log(`Added item on ${c.name}`, S.me.id, S.me.name);
    render();
    toast('Follow-up added');
  } catch (e) {
    console.error('Add item failed:', e);
    toast(e.message || 'Could not add follow-up');
  }
}
async function setItem(cid, iid, k, v){
  const c = S.clients.find(x => x.id === cid);
  if (!canEdit(c)) return;

  const i = c.items.find(x => x.id === iid);
  if (!i) return;

  const value = k === 'lead' ? (parseInt(v) || 0) : v;

  try {
    await API.updateItem(iid, { [k]: value });

    const fresh = await API.reloadCompany(cid);
    if (fresh) {
      const ix = S.clients.findIndex(x => x.id === cid);
      if (ix !== -1) S.clients[ix] = fresh;
    }

    await API.log(`Updated item on ${c.name}`, S.me.id, S.me.name);

  } catch (e) {
    console.error('Update item failed:', e);
    toast(e.message || 'Could not update item');
  }
}
async function toggleItem(cid, iid, on){

/* ---------- countries ---------- */
function countriesOf(c){
  if(c.countries&&c.countries.length) return c.countries;
  // fallback: split the old free-text location so nothing is lost
  return (c.country||'').split(/\s*[,/&]+\s*|\s+and\s+/).map(x=>x.trim()).filter(Boolean);
}
async function addCountry(id,val){
  if(!val) return;
  const c=S.clients.find(x=>x.id===id); if(!c||!canEdit(c)) return;
  const list=countriesOf(c);
  if(list.includes(val)) return;
  const next=[...list,val];
  try{ await API.updateCompany(c.id,{countries:next}); c.countries=next; c.country=next.join(', ');
    render(); }catch(e){ toast(e.message||'Could not add country'); }
}
async function removeCountryAt(id,ix){
  const c=S.clients.find(x=>x.id===id); if(!c||!canEdit(c)) return;
  const next=countriesOf(c).filter((_,i)=>i!==ix);
  try{ await API.updateCompany(c.id,{countries:next}); c.countries=next; c.country=next.join(', ');
    render(); }catch(e){ toast(e.message||'Could not remove country'); }
}

async function saveLog(){
  const c=S.clients.find(x=>x.id===S.logFor); if(!c||!canEdit(c)) return;
  const reached=document.querySelector('input[name=lc]:checked').value==='yes';
  const disc=document.getElementById('lg-disc').value.trim();
  const tasksRaw=document.getElementById('lg-tasks').value;
  const dl=document.getElementById('lg-dl').value;
  const lead=parseInt(document.getElementById('lg-lead').value)||7;
  const err=document.getElementById('lg-err');
  if(!reached && !disc){ err.textContent='Add a short note on what you tried.'; return; }
  try{
    await API.logContact(c.id,{contacted:reached,discussed:disc,
      nextDate: reached?null:new Date(Date.now()+86400000).toISOString().slice(0,10)}, S.me);
    // new tasks the user typed
    const bullets=tasksRaw.split('\n').map(t=>t.replace(/^[-•*]\s*/,'').trim()).filter(Boolean)
      .map(text=>({kind:'todo',text,deadline:dl||'',lead,recur:'None'}));
    // if not reached, auto-add a retry task for tomorrow
    if(!reached){ bullets.push({kind:'todo',text:'Retry contact — could not reach on '+todayISO(),
      deadline:new Date(Date.now()+86400000).toISOString().slice(0,10),lead:0,recur:'None'}); }
    if(bullets.length) await API.addItems(c.id,bullets);
    await API.log(`${reached?'Logged contact with':'Logged failed contact attempt for'} ${c.name}`, S.me.id, S.me.name);
    const fresh=await API.reloadCompany(c.id);
    if(fresh){ const ix=S.clients.findIndex(x=>x.id===c.id); if(ix!==-1) S.clients[ix]=fresh; }
    S.drawerLogs=null; S.modal=null;
    await openClientLogs(c.id);
    render(); toast('Log saved');
  }catch(e){ err.textContent=e.message||'Could not save the log.'; }
}

  const c = S.clients.find(x => x.id === id);
  if(!c) return;

  const note = prompt(
    'Message to the BD lead (optional)',
    'I would like to handle ' + c.name
  ) || '';

  try {
    await API.raiseRequest(
      id,
      note,
      S.me.id
    );

    await addLog(`Requested assignment for ${c.name}`);

    const data = await API.loadAll();
    S.reqs = data.reqs;

    render();
    toast('Request sent to the BD lead');

  } catch(e) {
    console.error('Assignment request failed:', e);
    toast(e.message || 'Could not send request.');
  }
}
async function resolveReq(rid, ok){
  const q = S.reqs.find(x => x.id === rid);
  if(!q) return;

  try {
    await API.resolveRequest(
      rid,
      ok,
      q.clientId,
      S.users.find(u => u.name === q.from)?.id,
      S.me.id
    );

    await addLog(
      `${ok ? 'Approved' : 'Declined'} ${q.from}'s request for ${q.client}`
    );

    const data = await API.loadAll();
    S.reqs = data.reqs;
    S.clients = data.clients;

    render();

    toast(
      ok
        ? `Assigned ${q.client} to ${q.from}`
        : 'Request declined'
    );

  } catch(e) {
    console.error('Assignment request resolution failed:', e);
    toast(e.message || 'Could not resolve request.');
  }
}

async function toggleUser(i) {
  const u = S.users[i];
  if (!u) return;

  // Deactivating
  if (u.active !== false) {
    const held = S.clients.filter(c => c.handlerId === u.id);

    if (held.length) {
      S.handover = { i, count: held.length };
      S.modal = handoverModal;
      render();
      return;
    }

    try {
      await API.setActive(u.id, false);

      const data = await API.loadAll();
      S.users = data.users;

      await addLog(`Deactivated ${u.name}`);

      render();
      toast(`Deactivated ${u.name}`);
    } catch (e) {
      console.error('Deactivate failed:', e);
      toast(e.message || 'Could not deactivate member.');
    }

    return;
  }

  // Reactivating
  try {
    await API.setActive(u.id, true);

    const data = await API.loadAll();
    S.users = data.users;

    await addLog(`Reactivated ${u.name}`);

    render();
    toast(`Reactivated ${u.name}`);

    toast(e.message || 'Could not reactivate member.');
  }

/* ---------- reminder digest (mail draft) ---------- */
function digestFor(name){
  const rows=S.clients.filter(c=>c.handler===name).flatMap(c=>openItems(c).map(i=>({c,i,s:itemState(i)})))
    .filter(o=>o.s.d!=null&&o.s.d<=daysToWeekEnd()).sort((a,b)=>a.s.d-b.s.d);
  return rows;
}
function mailDigest(){
  const lines=[]; const to=[];
  S.users.filter(u=>u.active!==false).forEach(u=>{
    const rows=digestFor(u.name); if(!rows.length) return; to.push(u.email);
    lines.push(u.name.toUpperCase()+' — '+rows.length+' item(s)');
    rows.forEach(o=>lines.push('  - ['+o.s.t+'] '+o.c.name+' ('+o.c.channel+'): '+o.i.text.replace(/\n/g,' ')));
    lines.push('');
  });
  if(!lines.length){ toast('Nothing due today — no digest to send'); return; }
  const body=encodeURIComponent('BD reminders for '+todayISO()+'\n\n'+lines.join('\n')+'\nOpen the BD Client Desk to close items.');
  window.location.href='mailto:'+to.join(',')+'?subject='+encodeURIComponent('VXL BD reminders — '+todayISO())+'&body='+body;
}

/* ---------- export ---------- */
function exportCSV(){
  if(!isAdmin()){ toast('Only the BD lead can export'); return; }
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['Company','Location','Channel','Type','Handler','Priority','Status','Last contacted','Lead since','Converted on','Item','Item type','Deadline','Remind days early','Repeats','Item status','Closed on','Closed by','Notes'];
  const rows=[head.map(q).join(',')];
  filtered().forEach(c=>{
    const its=(c.items||[]).length?c.items:[{text:'',kind:'',deadline:'',lead:'',recur:'',done:false}];
    its.forEach(i=>rows.push([c.name,c.country,c.channel,c.category,c.handler,c.priority,c.status,c.lastContacted,
      c.leadSince,c.convertedAt,i.text,i.kind,i.deadline,i.lead,i.recur,i.done?'Closed':itemState(i).t,
      (i.doneAt||'').slice(0,10),i.doneBy,c.notes].map(q).join(',')));
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\r\n')],{type:'text/csv'}));
  a.download='VXL_clients_'+todayISO()+'.csv'; a.click();
  addLog('Exported CSV ('+(rows.length-1)+' rows)');
}

/* ---------- add company ---------- */
const NEW={bullets:[]};
function openNew(){ Object.assign(NEW,{name:'',country:'',countries:[],channel:'',category:'',
  handler:isAdmin()?'Unassigned':S.me.name,status:'Not Started',priority:'Medium',notes:'',bullets:[]});
  S.modal=newModal; render(); }
function newModal(){
  const chip=(k,v,label)=>`<label class="${NEW[k]===v?'on':''}"><input type="radio" name="${k}" ${NEW[k]===v?'checked':''} onchange="NEW.${k}='${esc(v)}';render()">${esc(label)}</label>`;
  return `<div class="scrim" onclick="S.modal=null;render()"></div><div class="modal">
    <div class="drawer-head"><div><div class="eyebrow">New record</div><h2>Add a company</h2></div><button class="x" onclick="S.modal=null;render()">×</button></div>
    <div class="row2"><div class="field"><span class="lbl">Company name</span><input type="text" value="${esc(NEW.name)}" oninput="NEW.name=this.value"></div>
      <div class="field"><span class="lbl">Countries / markets (one or more)</span>
        <select onchange="if(this.value&&!NEW.countries.includes(this.value))NEW.countries.push(this.value);this.value='';render()">
          <option value="">+ add a country or region…</option>
          <optgroup label="Regions">${REGIONS.map(x=>`<option>${esc(x)}</option>`).join('')}</optgroup>
          <optgroup label="Countries">${COUNTRIES.map(x=>`<option>${esc(x)}</option>`).join('')}</optgroup></select>
        <div class="chips">${NEW.countries.map((cn,ix)=>`<span class="chip">${esc(cn)}<button onclick="NEW.countries.splice(${ix},1);render()">×</button></span>`).join('')||'<span class="sm-muted">None yet</span>'}</div></div></div>
    <div class="field"><span class="lbl">Type of business — pick one</span><div class="choice">${CHANNELS.map(c=>chip('channel',c,c)).join('')}</div></div>
    <div class="field"><span class="lbl">Account or lead — pick one</span><div class="choice">${CATS.map(c=>chip('category',c,c==='Account'?'Account (existing)':'Lead (prospect)')).join('')}</div></div>
    <div class="row2"><div class="field"><span class="lbl">Handler</span>
      ${isAdmin()?`<select onchange="NEW.handler=this.value">${members().concat(['Unassigned']).map(n=>`<option ${NEW.handler===n?'selected':''}>${esc(n)}</option>`).join('')}</select>`
      :`<input type="text" value="${esc(S.me.name)}" disabled><div class="sm-muted" style="font-size:11px;margin-top:4px">New companies come to you; the BD lead can reassign.</div>`}</div>
      <div class="field"><span class="lbl">Priority</span><select onchange="NEW.priority=this.value">${PRIOS.map(p=>`<option ${NEW.priority===p?'selected':''}>${p}</option>`).join('')}</select></div></div>
    <div class="field"><span class="lbl">First follow-ups — one bullet at a time</span>
      <div class="tasks">${NEW.bullets.length?NEW.bullets.map((b,ix)=>`<div class="task">
          <input type="checkbox" class="tick" disabled><div class="body"><div class="txt">${esc(b.text)}</div>
          <div class="meta"><span class="tag">${b.kind==='update'?'Update':'To-do'}</span>
            <span class="sm-muted">${b.deadline?'due '+b.deadline+' · remind '+b.lead+'d early':'no date'}${b.recur&&b.recur!=='None'?' · ↻ '+b.recur:''}</span>
            <a href="#" class="sm-muted" onclick="NEW.bullets.splice(${ix},1);render();return false">remove</a></div></div></div>`).join('')
        :'<div class="empty" style="padding:14px">No bullets yet. Add at least the first follow-up.</div>'}
        <div class="addtask"><select id="bk" style="width:auto">${KINDS.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>
          <textarea id="bt" placeholder="e.g. Send PIC/S GMP certificate"></textarea>
          <input type="date" id="bd" style="width:auto"><input type="number" id="bl" value="7" min="0" max="90" style="width:64px" title="Remind days early">
          <select id="br" style="width:auto" title="Repeat after closing">${RECUR.map(r=>`<option>${r}</option>`).join('')}</select>
          <button class="btn alt sm" onclick="addBullet()">Add bullet</button></div></div></div>
    <div class="err" id="nerr"></div>
    <div style="display:flex;gap:8px"><button class="btn teal" onclick="saveNew()">Add company</button>
      <button class="btn alt" onclick="S.modal=null;render()">Cancel</button></div></div>`;
}
function addBullet(){
  const t=document.getElementById('bt').value.trim(); if(!t){toast('Type the follow-up first');return;}
  const kind=document.getElementById('bk').value,dl=document.getElementById('bd').value,
    ld=parseInt(document.getElementById('bl').value)||0,rc=document.getElementById('br').value;
  t.split('\n').map(x=>x.replace(/^[-•*]\s*/,'').trim()).filter(Boolean).forEach(txt=>NEW.bullets.push({text:txt,kind,deadline:dl,lead:ld,recur:rc}));
  render();
}
async function saveNew(){
  const e = document.getElementById('nerr');

  if(!NEW.name.trim()){
    e.textContent = 'Enter the company name.';
    return;
  }

  if(!NEW.channel){
    e.textContent = 'Pick one type of business.';
    return;
  }

  if(!NEW.category){
    e.textContent = 'Pick whether this is an account or a lead.';
    return;
  }

  try {
    const c = {
      name: NEW.name.trim(),
      country: NEW.countries.join(', '),
      countries: NEW.countries,
      channel: NEW.channel,
      category: NEW.category,
      handlerId: isAdmin()
        ? S.users.find(u => u.name === NEW.handler)?.id ?? null
        : S.me.id,
      priority: NEW.priority
    };

    const id = await API.addCompany(c, NEW.bullets);

    const created = await API.reloadCompany(id);

    if(created){
      S.clients.unshift(created);
    }

    S.modal = null;
    render();
    toast(`Added ${c.name}`);
  } catch(err) {
    console.error('Add company failed:', err);
    e.textContent = err.message || 'Could not add company.';
  }
}

/* ---------- activity ---------- */
function activityView(){
  return `<div class="section-head"><h2>Activity</h2><span class="eyebrow">last ${S.log.length} changes</span></div>
  <div class="panel">${S.log.length?S.log.map(l=>`<div class="logline"><span class="mono sm-muted">${new Date(l.t).toLocaleString()}</span> — <b>${esc(l.who)}</b> ${esc(l.text)}</div>`).join('')
    :'<div class="empty">Nothing logged yet.</div>'}</div>`;
}
boot();
</script>
